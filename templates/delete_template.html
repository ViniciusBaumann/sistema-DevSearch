{% extends 'main.html' %}
{% block content %}

<main class="formPage my-xl">
    <div class="content-box">
        <div class="formWrapper">
            <br>
            <!-- enctype="multipart/form-data" Faz o envio do formulario-->
            <form action="" method="POST">
                {% csrf_token %}

                <p>Do you want to delete the project "{{object}}"?</p>
                <a class="btn btn--sub btn--lg  my-md" href="{{request.GET.next}}">Go Back</a>

                <input class="btn btn--sub btn--lg  my-md" type="submit" value="Confirm" />
            </form>
        </div>
    </div>
</main> 
{% endblock content %}
