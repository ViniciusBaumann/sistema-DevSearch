{% extends 'main.html' %}

{% block content %}

<img style="max-width: 200px;" src="{{ projectObj.featured_image.url }}">

<h1>{{projectObj.title}}</h1>
<hr>
{% for tag in projectObj.tags.all %}
    <span style="border:1px solid grey">{{tag}}</span>
{% endfor%}
<hr>
<br>
<p>Description: {{projectObj.description}}</p>

{% endblock content %}
